# Render Blueprint for the PayToProvision app itself (one free web service).
# Preview environments are NOT defined here; the app creates them through the Render API.
# Values marked `sync: false` are asked for once, when you create the Blueprint.
services:
  - type: web
    name: paytoprovision
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && pip install --no-deps paypal-agent-toolkit==1.11.0
    # Migrations run on boot: free instances have no pre-deploy step.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /healthz
    # Deploys are triggered by GitHub Actions after CI passes (.github/workflows/ci.yml).
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: APP_ENV
        value: production
      - key: APP_BASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: INTERNAL_REAP_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: paytoprovision-db
          property: connectionString
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_OWNER_ID
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      # Sign in with GitHub (OAuth App). Optional: leave empty to hide sign-in.
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: NEBIUS_API_KEY
        sync: false
      - key: NEBIUS_MODEL
        value: nvidia/nemotron-3-super-120b-a12b
      - key: PREVIEW_NAME_PREFIX
        value: ptp-
      - key: PREVIEW_PLAN
        value: free
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ALLOWED_REPOS
        sync: false

databases:
  # Free Render Postgres expires 30 days after creation; upgrade the plan in place
  # (data is kept) if the demo must stay up longer for judging.
  - name: paytoprovision-db
    plan: free
    region: oregon
    databaseName: paytoprovision
    user: paytoprovision
    postgresMajorVersion: "17"
    ipAllowList: [] # private network only; the app connects via the internal URL
