{% extends "base.html" %}
{% block title %}{{ status }} · PayToProvision{% endblock %}
{% block content %}
<section class="band">
  <div class="mx-auto max-w-xl px-4 py-28 text-center sm:px-6">
    <p class="font-mono text-6xl font-bold tracking-tight text-gradient">{{ status }}</p>
    <h1 class="mt-4 text-3xl font-bold tracking-tight">
      {% if status == 404 %}We couldn't find that page{% elif status == 403 %}You can't open this{% else %}Something went wrong{% endif %}
    </h1>
    <p class="mt-3 text-slate-400">{{ detail }}</p>
    <a href="/" class="mt-8 inline-block rounded-xl bg-white px-5 py-3 text-sm font-semibold text-ink-950 hover:bg-indigo-50">Back to home</a>
  </div>
</section>
{% endblock %}
