<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PayToProvision{% endblock %}</title>
  <meta name="description" content="Turn any GitHub repo into a paid live demo. AI makes it deployable, buyers pay with PayPal, Render runs it.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M10 22V10h7a4 4 0 0 1 0 8h-7' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style type="text/tailwindcss">
    @theme {
      --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
    }
  </style>
  <style>
    /* HTMX loading states: .htmx-indicator shows only while its request is in flight. */
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { display: flex; }
    .htmx-request .hide-while-loading { display: none; }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-900 antialiased flex flex-col">
  <header class="sticky top-0 z-30 border-b border-slate-200/70 bg-white/80 backdrop-blur">
    <nav class="mx-auto flex h-16 max-w-6xl items-center justify-between px-4 sm:px-6">
      <a href="/" class="flex items-center gap-2.5 font-semibold tracking-tight">
        <span class="grid h-8 w-8 place-items-center rounded-lg bg-indigo-600 text-white shadow-sm shadow-indigo-600/30">
          <svg viewBox="0 0 32 32" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 24V8h7a5 5 0 0 1 0 10h-7"/></svg>
        </span>
        PayToProvision
      </a>
      <div class="flex items-center gap-1 whitespace-nowrap text-sm font-medium text-slate-600">
        <a href="/#how" class="hidden rounded-lg px-3 py-2 hover:bg-slate-100 hover:text-slate-900 sm:block">How it works</a>
        <a href="/#listings" class="hidden rounded-lg px-3 py-2 hover:bg-slate-100 hover:text-slate-900 sm:block">Browse demos</a>
        <a href="/owner/dashboard" class="hidden rounded-lg px-3 py-2 hover:bg-slate-100 hover:text-slate-900 sm:block">Dashboard</a>
        <a href="/owner/new" class="ml-1 rounded-lg bg-slate-900 px-3 py-2 text-white hover:bg-slate-700">List your repo</a>
      </div>
    </nav>
  </header>

  <main class="flex-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-t border-slate-200 bg-white">
    <div class="mx-auto flex max-w-6xl flex-col gap-2 px-4 py-6 text-sm text-slate-500 sm:flex-row sm:items-center sm:justify-between sm:px-6">
      <p>PayToProvision: paid live demos for any GitHub repo.</p>
      <p class="flex items-center gap-2">
        <span class="inline-flex items-center rounded-full bg-amber-50 px-2 py-0.5 text-xs font-medium text-amber-700 ring-1 ring-amber-200">PayPal sandbox</span>
        No real money moves.
      </p>
    </div>
  </footer>
</body>
</html>
