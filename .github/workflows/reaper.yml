# Every 15 minutes: delete expired previews and orphans, resume stuck deploys, retry refunds.
# Calling the endpoint also wakes the free Render instance if it's asleep.
#
# Setup: repo Settings -> Secrets and variables -> Actions
#   secret   INTERNAL_REAP_TOKEN = the app's INTERNAL_REAP_TOKEN (Render generated it)
#   variable APP_URL             = https://paytoprovision.onrender.com (optional; this is the default)
name: Reaper

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  reap:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: POST /internal/reap
        env:
          APP_URL: ${{ vars.APP_URL || 'https://paytoprovision.onrender.com' }}
          TOKEN: ${{ secrets.INTERNAL_REAP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::INTERNAL_REAP_TOKEN secret is not set"; exit 1; fi
          # Free instances take ~1 min to wake, so allow a long first response and retry.
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 20 --retry-all-errors --max-time 150 \
            -X POST -H "Authorization: Bearer $TOKEN" "$APP_URL/internal/reap"
          echo
